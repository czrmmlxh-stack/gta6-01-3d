<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunvale 3D — an open-world crime story</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87b5d6; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  #topleft { position: absolute; top: 14px; left: 16px; }
  #healthbar { width: 210px; height: 14px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.5); border-radius: 3px; overflow: hidden; }
  #healthfill { height: 100%; width: 100%; background: #43d14f; }
  #money { font-size: 22px; font-weight: 700; margin-top: 6px; }
  #stars { font-size: 26px; letter-spacing: 2px; color: #ffd21f; margin-top: 2px; min-height: 32px; }
  #minimap { position: absolute; top: 14px; right: 16px; width: 172px; height: 172px; border: 2px solid rgba(255,255,255,.65); border-radius: 4px; background: #20262c; }
  #objective { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); max-width: 70%; text-align: center; font-size: 17px; background: rgba(0,0,0,.55); padding: 8px 16px; border-radius: 6px; }
  #objective b { color: #ffd21f; }
  #missions { position: absolute; left: 16px; top: 118px; width: 244px; font-size: 13px; line-height: 1.55; background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 6px; display: none; }
  #missions .head { color: #ffd21f; font-weight: 700; letter-spacing: 1px; margin-bottom: 3px; }
  #missions .done { color: #8fd694; }
  #missions .current { color: #ffd21f; font-weight: 700; }
  #missions .locked { color: #9aa0aa; }
  #missions .garage { color: #ffd21f; margin-top: 4px; }
  #dispatch { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); font-size: 13px; letter-spacing: 1px; background: rgba(0,0,0,.55); padding: 6px 14px; border-radius: 6px; display: none; white-space: nowrap; }
  #stats { position: absolute; left: 16px; bottom: 26px; font-size: 14px; background: rgba(0,0,0,.55); padding: 7px 12px; border-radius: 6px; display: none; }
  #stats b { color: #ffd21f; }
  #speed { position: absolute; right: 16px; bottom: 26px; font-size: 26px; font-weight: 800; background: rgba(0,0,0,.55); padding: 4px 14px; border-radius: 6px; display: none; }
  #radio { position: absolute; right: 16px; top: 198px; font-size: 13px; letter-spacing: 1px; background: rgba(0,0,0,.55); padding: 6px 12px; border-radius: 6px; display: none; }
  #banner { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); text-align: center; font-size: 34px; font-weight: 800; color: #ffd21f; display: none; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; display: none; }
  #crosshair:before, #crosshair:after { content: ''; position: absolute; background: #fff; box-shadow: 0 0 3px #000; }
  #crosshair:before { left: 8px; top: 0; width: 2px; height: 18px; }
  #crosshair:after { left: 0; top: 8px; width: 18px; height: 2px; }
  #panel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10,14,20,.45); }
  #panel .card { background: rgba(16,20,28,.92); border: 1px solid rgba(255,255,255,.25); border-radius: 10px; padding: 28px 36px; max-width: 560px; text-align: center; }
  #panel h1 { margin: 0 0 6px; font-size: 44px; letter-spacing: 4px; color: #ffd21f; }
  #panel h2 { margin: 0 0 14px; font-size: 15px; font-weight: 400; color: #c8ccd4; }
  #panel p { margin: 6px 0; font-size: 15px; color: #e8ebef; line-height: 1.5; }
  #panel .prompt { margin-top: 18px; font-size: 17px; color: #ffd21f; font-weight: 700; }
  #panel .fine { font-size: 12px; color: #8b93a3; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Sunvale 3D: an open-world crime game. Drive, steal cars, dodge the police and run Marla's missions."></canvas>
<div id="hud">
  <div id="topleft">
    <div id="healthbar"><div id="healthfill"></div></div>
    <div id="money">$0</div>
    <div id="stars"></div>
  </div>
  <canvas id="minimap" width="172" height="172"></canvas>
  <div id="missions"></div>
  <div id="dispatch"></div>
  <div id="stats"></div>
  <div id="speed"></div>
  <div id="radio"></div>
  <div id="objective"></div>
  <div id="banner"></div>
  <div id="crosshair"></div>
  <div id="panel"></div>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
